services:
  mockserver:
    image: mockserver/mockserver:latest
    ports:
      - "1080:1080"
    environment:
      MOCKSERVER_INITIALIZATION_JSON_PATH: /config/expectations.json
    volumes:
      - ./expectations.json:/config/expectations.json:ro
      - ./mock-spec.json:/config/mock-spec.json:ro

  db:
    image: supabase/postgres:15.14.1.081
    ports:
      - "54322:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./setup-role.sql:/docker-entrypoint-initdb.d/00-setup-role.sql:ro
      - ./init.sql:/docker-entrypoint-initdb.d/99-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supabase_admin"]
      interval: 2s
      timeout: 5s
      retries: 10
    depends_on:
      - mockserver
